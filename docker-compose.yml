services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgres://openzev:openzev@db:5432/openzev
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8001:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info
    env_file:
      - backend/.env.example
    environment:
      DATABASE_URL: postgres://openzev:openzev@db:5432/openzev
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        NGINX_CONF: nginx.compose.conf
    ports:
      - "8080:80"
    depends_on:
      - backend

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openzev
      POSTGRES_USER: openzev
      POSTGRES_PASSWORD: openzev
      # Pinned rather than inherited: the image default is
      # /var/lib/postgresql/$PG_MAJOR/docker, so the major version is baked into
      # the path and the next major bump would point at an empty directory,
      # initdb over a volume that still holds the old cluster. A subdirectory of
      # the mount also keeps lost+found out of initdb's way.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      # docker-compose.dev.yml and docker-compose.fullstack.yml must mount this
      # volume at the same path — they share the name, and a differing path gives
      # each stack a cluster the others cannot see (#492).
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  backend_media:
