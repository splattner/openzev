name: PR Quality

on:
    pull_request:
        branches: [main]
        paths-ignore:
            # Prose only: nothing here is read by a test, embedded in an image,
            # or loaded at runtime. A PR touching these *and* code still runs
            # everything — paths-ignore skips only when every changed file
            # matches.
            - "docs/**"
            - "**/*.md"
            - ".claude/**"
    schedule:
        # Weekly: surface new advisories on unchanged lockfiles.
        - cron: "30 2 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    frontend-lint-build:
        if: github.event_name == 'pull_request'
        name: Frontend lint and build (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["24.15.0", "24.20.0", "26"]
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Lint styles (no raw hex)
              run: npm run lint:style

            - name: Hex sweep (tokens SSOT enforcement)
              run: node ../scripts/check-frontend-hex.mjs

            - name: Check design tokens
              run: node ../scripts/generate-tokens.mjs --check

            - name: Token idempotence test
              run: node --test ../design/tokens.test.mjs

            - name: Run unit tests
              run: npm run test:unit

            - name: Build frontend
              run: npm run build

    helm-lint-template:
        if: github.event_name == 'pull_request'
        name: Helm lint and template
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Helm
              uses: azure/setup-helm@v5

            - name: Lint chart
              run: helm lint ./charts/openzev

            - name: Render chart
              run: helm template openzev ./charts/openzev > /tmp/openzev-helm-render.yaml

    backend-check-test:
        if: github.event_name == 'pull_request'
        name: Backend checks and tests
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: openzev
                    POSTGRES_PASSWORD: openzev
                    POSTGRES_DB: openzev
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U openzev"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Lint
              run: ruff check .

            - name: Create .env from example
              run: cp .env.example .env

            - name: Django system check
              run: python manage.py check

            - name: Run tests with coverage
              run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

            - name: Verify PostgreSQL retention and concurrency
              env:
                  DATABASE_URL: postgres://openzev:openzev@localhost:5432/openzev
              run: python -m pytest -n 2 invoices/test_dynamic_evidence.py tariffs/test_dynamic_fetch.py zev/test_transfer.py invoices/test_workflow.py

    dependency-audit:
        name: Dependency audit (pip-audit, npm audit)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"

            - name: Audit Python dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit
                  pip-audit -r backend/requirements.txt --strict

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: "24.21.0"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Audit production frontend dependencies
              run: npm audit --omit=dev --audit-level=high
              working-directory: frontend
