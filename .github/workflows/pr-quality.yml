name: PR Quality

on:
    pull_request:
        branches: [main]
        paths-ignore:
            # Prose only: nothing here is read by a test, embedded in an image,
            # or loaded at runtime. A PR touching these *and* code still runs
            # everything — paths-ignore skips only when every changed file
            # matches.
            - "docs/**"
            - "**/*.md"
            - ".claude/**"

permissions:
    contents: read

jobs:
    frontend-lint-build:
        name: Frontend lint and build (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["24.15.0", "24.20.0", "26"]
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Run lint
              run: npm run lint

            - name: Lint styles (no raw hex)
              run: npm run lint:style

            - name: Hex sweep (tokens SSOT enforcement)
              run: node ../scripts/check-frontend-hex.mjs

            - name: Check design tokens
              run: node ../scripts/generate-tokens.mjs --check

            - name: Token idempotence test
              run: node --test ../design/tokens.test.mjs

            - name: Run unit tests
              run: npm run test:unit

            - name: Build frontend
              run: npm run build

    helm-lint-template:
        name: Helm lint and template
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Helm
              uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.14"

            - name: Install chart check dependency
              run: python -m pip install PyYAML==6.0.3

            - name: Lint chart
              run: helm lint ./charts/openzev

            - name: Check rendered routing and security settings
              run: python scripts/check-helm-render.py

    backend-check-test:
        name: Backend checks and tests (${{ matrix.database }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # The whole suite on both: SQLite is the zero-setup local
                # default, PostgreSQL is what production runs, and failures
                # that only PostgreSQL shows (plans, isolation levels, bytea)
                # would otherwise go unnoticed.
                include:
                    - database: sqlite
                      database-url: sqlite:///db.sqlite3
                    - database: postgresql
                      database-url: postgres://openzev:openzev@localhost:5432/openzev
        env:
            DATABASE_URL: ${{ matrix.database-url }}
            TEST_VALKEY_URL: redis://localhost:6379/15
        services:
            valkey:
                image: valkey/valkey:9-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "valkey-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: openzev
                    POSTGRES_PASSWORD: openzev
                    POSTGRES_DB: openzev
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U openzev"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.14"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Lint
              run: ruff check .

            - name: Create .env from example
              run: cp .env.example .env

            - name: Django system check
              run: python manage.py check

            - name: Check migration consistency
              run: python manage.py makemigrations --check --dry-run

            - name: Run tests with coverage
              run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
