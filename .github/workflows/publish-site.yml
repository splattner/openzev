name: Publish Site

# The site is deployed as a GitHub Pages artifact (actions/deploy-pages), so
# no copy of it is committed anywhere and the user-guide screenshots do not
# pile up in git history. Pages must use the "GitHub Actions" source in the
# repository settings.
#
# The gh-pages branch is now only the Helm repository: chart-releaser owns
# `index.yaml` and every `openzev-*.tgz` there. Because a Pages deployment
# replaces everything that is served, this workflow copies those files from
# gh-pages into the artifact next to the landing page (`index.html`,
# `assets/`, one directory per extra language) and the user guide (`docs/`,
# built from docs/user-guide with MkDocs), so `helm repo add` keeps resolving
# `index.yaml` from the same origin. release-please.yml calls this workflow
# again after every chart release so a new chart goes live.

on:
    push:
        branches: [main]
        paths:
            - "docs/site/**"
            - "scripts/site/**"
            - "docs/user-guide/**"
            - "mkdocs.yml"
            - ".github/workflows/publish-site.yml"
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Never cancel a running deployment; a newer one queues behind it.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        name: Build the site
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: source

            - name: Checkout the Helm repository files from gh-pages
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: gh-pages
                  path: pages

            - name: Check the language pages are up to date
              run: python3 source/scripts/site/build.py --check

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.14"

            - name: Build the user guide
              working-directory: source
              run: |
                  set -euo pipefail
                  pip install -r scripts/site/requirements-docs.txt
                  mkdocs build --strict

            - name: Stage the site
              run: |
                  set -euo pipefail
                  mkdir _site
                  cp -R source/docs/site/. _site/
                  cp -R source/build/site-docs _site/docs
                  # The Helm repository: the index and every chart package it lists.
                  cp pages/index.yaml pages/openzev-*.tgz _site/
                  # Keep Jekyll off.
                  touch _site/.nojekyll

            - name: Upload the Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: _site

    deploy:
        name: Deploy to GitHub Pages
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
