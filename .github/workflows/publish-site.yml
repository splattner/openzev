name: Publish Site

# The gh-pages branch is a Helm repository first: chart-releaser owns
# `index.yaml` and every `openzev-*.tgz` there. This workflow only ever writes
# the site's own paths (`index.html`, `assets/` and one directory per extra
# language), so a browser gets the landing page and
# `helm repo add` keeps resolving `index.yaml` from the same origin.

on:
    push:
        branches: [main]
        paths:
            - "docs/site/**"
            - "scripts/site/**"
            - ".github/workflows/publish-site.yml"
    workflow_dispatch:

permissions:
    contents: write

# Serialise against any other job pushing to gh-pages.
concurrency:
    group: gh-pages
    cancel-in-progress: false

jobs:
    publish-site:
        name: Copy docs/site to gh-pages
        runs-on: ubuntu-latest
        steps:
            - name: Checkout main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: source

            - name: Checkout gh-pages
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: gh-pages
                  path: pages

            - name: Check the language pages are up to date
              run: python3 source/scripts/site/build.py --check

            - name: Stage the site
              run: |
                  set -euo pipefail
                  # Replace the site's own paths wholesale so removed assets and
                  # pages do not linger, and leave everything else on the branch
                  # alone.
                  rm -rf pages/assets pages/en pages/fr pages/it
                  cp -R source/docs/site/. pages/
                  # Keep Jekyll off; chart-releaser created this originally.
                  touch pages/.nojekyll

            - name: Commit and push
              working-directory: pages
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                  git add index.html assets en fr it .nojekyll
                  if git diff --cached --quiet; then
                      echo "Site is already up to date."
                      exit 0
                  fi
                  git commit -m "docs(site): publish from ${GITHUB_SHA::7}"

                  # chart-releaser may have pushed between checkout and now.
                  for attempt in 1 2 3; do
                      if git push origin gh-pages; then
                          echo "Pushed on attempt ${attempt}."
                          exit 0
                      fi
                      echo "Push rejected, rebasing on gh-pages (attempt ${attempt})."
                      git pull --rebase origin gh-pages
                  done
                  echo "Could not push to gh-pages after 3 attempts." >&2
                  exit 1
