name: Release Images

on:
    workflow_call:
        inputs:
            tag_name:
                required: true
                type: string
    release:
        types: [published]

permissions:
    contents: write
    packages: write
    id-token: write

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/openzev
    TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}

jobs:
    build-push-sign:
        name: Build, push, sign and SBOM (${{ matrix.image }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: backend
                      context: .
                      dockerfile: backend/Dockerfile
                      build_args: ""
                    - image: frontend
                      context: .
                      dockerfile: frontend/Dockerfile
                      build_args: VITE_API_BASE_URL=/api/v1
                    - image: fullstack
                      context: .
                      dockerfile: Dockerfile.fullstack
                      build_args: VITE_API_BASE_URL=/api/v1

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Compute build timestamp
              id: ts
              run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
                  tags: |
                      type=raw,value=${{ env.TAG_NAME }}
                      type=raw,value=latest

            - name: Build and push image
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.dockerfile }}
                  build-args: |
                      ${{ matrix.build_args }}
                      OCI_VERSION=${{ env.TAG_NAME }}
                      OCI_REVISION=${{ github.sha }}
                      OCI_CREATED=${{ steps.ts.outputs.created }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  sbom: true
                  provenance: true

            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: Prepare SBOM metadata
              id: sbom
              run: |
                  IMAGE_REF="${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@${{ steps.build.outputs.digest }}"
                  SBOM_FILE="sbom-${{ matrix.image }}-${{ env.TAG_NAME }}.spdx.json"
                  echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
                  echo "sbom_file=$SBOM_FILE" >> "$GITHUB_OUTPUT"

            - name: Generate SBOM file (Trivy)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: image
                  image-ref: ${{ steps.sbom.outputs.image_ref }}
                  format: spdx-json
                  output: ${{ steps.sbom.outputs.sbom_file }}

            - name: Sign image (keyless)
              run: cosign sign --yes "${{ steps.sbom.outputs.image_ref }}"

            - name: Attest SBOM (keyless)
              run: |
                  cosign attest --yes \
                    --type spdxjson \
                    --predicate "${{ steps.sbom.outputs.sbom_file }}" \
                    "${{ steps.sbom.outputs.image_ref }}"

            - name: Upload SBOM artifact
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: sbom-${{ matrix.image }}
                  path: ${{ steps.sbom.outputs.sbom_file }}
                  if-no-files-found: error

    publish-release-assets:
        name: Publish SBOM release assets
        runs-on: ubuntu-latest
        needs: build-push-sign

        steps:
            - name: Download SBOM artifacts
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  path: sbom-assets

            - name: Attach SBOM files to GitHub release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
              with:
                  tag_name: ${{ env.TAG_NAME }}
                  files: sbom-assets/**/*.spdx.json
