name: Container Build Check

on:
    pull_request:
        branches: [main]
        paths-ignore:
            # Prose only: nothing here is read by a test, embedded in an image,
            # or loaded at runtime. A PR touching these *and* code still runs
            # everything — paths-ignore skips only when every changed file
            # matches.
            - "docs/**"
            - "**/*.md"
            - ".claude/**"
    push:
        branches: [main]
        # Same set: a docs-only merge produces no new image because it would be
        # byte-identical to the last one.
        paths-ignore:
            - "docs/**"
            - "**/*.md"
            - ".claude/**"

permissions:
    contents: read
    packages: write
    id-token: write

env:
    REGISTRY: ghcr.io
    IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/openzev

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - image: backend
                      context: .
                      dockerfile: backend/Dockerfile
                      build_args: ""
                    - image: frontend
                      context: .
                      dockerfile: frontend/Dockerfile
                      build_args: ""
                    - image: fullstack
                      context: .
                      dockerfile: Dockerfile.fullstack
                      build_args: VITE_API_BASE_URL=/api/v1

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Compute build timestamp
              id: ts
              run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

            - name: Login to GHCR
              if: github.event_name == 'push'
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              if: github.event_name == 'push'
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
                  tags: |
                      type=raw,value=main
                      type=sha,prefix=main-,format=short

            - name: Build ${{ matrix.image }} image
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.dockerfile }}
                  push: ${{ github.event_name == 'push' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      ${{ matrix.build_args }}
                      OCI_VERSION=main
                      OCI_REVISION=${{ github.sha }}
                      OCI_CREATED=${{ steps.ts.outputs.created }}
                  sbom: ${{ github.event_name == 'push' }}
                  provenance: ${{ github.event_name == 'push' }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Install cosign
              if: github.event_name == 'push'
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: Prepare SBOM metadata
              id: sbom
              if: github.event_name == 'push'
              run: |
                  SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
                  IMAGE_REF="${{ env.IMAGE_PREFIX }}-${{ matrix.image }}@${{ steps.build.outputs.digest }}"
                  SBOM_FILE="sbom-${{ matrix.image }}-main-${SHORT_SHA}.spdx.json"
                  echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
                  echo "sbom_file=$SBOM_FILE" >> "$GITHUB_OUTPUT"

            - name: Generate SBOM file (Trivy)
              if: github.event_name == 'push'
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  scan-type: image
                  image-ref: ${{ steps.sbom.outputs.image_ref }}
                  format: spdx-json
                  output: ${{ steps.sbom.outputs.sbom_file }}

            - name: Sign image (keyless)
              if: github.event_name == 'push'
              run: cosign sign --yes "${{ steps.sbom.outputs.image_ref }}"

            - name: Attest SBOM (keyless)
              if: github.event_name == 'push'
              run: |
                  cosign attest --yes \
                    --type spdxjson \
                    --predicate "${{ steps.sbom.outputs.sbom_file }}" \
                    "${{ steps.sbom.outputs.image_ref }}"

            - name: Upload SBOM artifact
              if: github.event_name == 'push'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: sbom-${{ matrix.image }}-main
                  path: ${{ steps.sbom.outputs.sbom_file }}
                  if-no-files-found: error
