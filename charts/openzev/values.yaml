nameOverride: ""
fullnameOverride: ""

commonLabels: {}

# Set true only for local development; production renders reject placeholder secrets.
debug: false

# Shared workload defaults: every workload runs as UID 10001 with privilege
# escalation disabled. Override per component as needed.
x-podSecurityContext: &defaultPodSecurityContext
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
x-securityContext: &defaultSecurityContext
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: false # nginx and PDF rendering need writable runtime paths.

# Public frontend base URL used by backend-generated links/redirects
# (verification emails and OAuth callback redirects).
frontendUrl: "http://localhost:5173"

secretKey:
  value: "change-me-in-production-use-a-long-random-string"
  existingSecret:
    name: ""
    key: SECRET_KEY

# Fernet key(s) that encrypt two-factor (TOTP) secrets at rest, comma-separated
# newest-first so a key can be rotated without invalidating enrolments. Kept
# separate from secretKey on purpose (ADR 0021). Empty means two-factor
# enrolment is refused until a key is set. Generate one with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
mfaEncryptionKeys:
  value: ""
  existingSecret:
    name: ""
    key: MFA_ENCRYPTION_KEYS

# Key(s) that encrypt backup archives and stored backup-destination secrets,
# comma-separated newest-first (at least 32 characters each; the first
# encrypts, all decrypt). Independent of secretKey and mfaEncryptionKeys
# (ADR 0024). Empty blocks backup creation unless BACKUP_REQUIRE_ENCRYPTION=False
# is set in backend and worker extraEnv. Generate one with:
#   python -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
backupEncryptionKeys:
  value: ""
  existingSecret:
    name: ""
    key: BACKUP_ENCRYPTION_KEYS

# Key(s) that encrypt third-party integration credentials at rest (a participant's
# Solar Manager API key), comma-separated newest-first (first encrypts, all
# decrypt). Independent of secretKey, mfaEncryptionKeys and backupEncryptionKeys
# (ADR 0031). Needed by the backend and the worker. Empty means pull sources
# cannot be connected; push and file import keep working. Generate one with:
#   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
integrationEncryptionKeys:
  value: ""
  existingSecret:
    name: ""
    key: INTEGRATION_ENCRYPTION_KEYS

# Passkeys (WebAuthn) relying-party identity. It must match what the browser
# sees: rpId is the bare domain users open OpenZEV on (no scheme, no port),
# origin the full origin the frontend is served from. Leave empty for local
# development (the backend defaults to localhost); set both in production or
# every passkey ceremony fails with an opaque browser error.
webauthn:
  rpId: ""
  rpName: ""
  origin: ""

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/splattner/openzev-backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  podAnnotations: {}
  secureSslRedirect: true
  hstsSeconds: 31536000
  podSecurityContext: *defaultPodSecurityContext
  securityContext: *defaultSecurityContext
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}
  # Comma-separated list for Django ALLOWED_HOSTS.
  # Example: "openzev.example.com,openzev.local"
  allowedHosts: ""
  # Comma-separated origins (scheme + host) allowed to make browser API calls.
  # Example: "https://openzev.example.com"
  corsAllowedOrigins: ""
  # Comma-separated origins (scheme + host) Django trusts for CSRF on unsafe
  # methods. Cookie-authenticated writes (e.g. imports) fail without this.
  # Defaults to corsAllowedOrigins when left empty.
  # Example: "https://openzev.example.com"
  csrfTrustedOrigins: ""
  # Trusted forwarded-address count; also gates HTTPS detection. See the README.
  numProxies: 0

worker:
  replicaCount: 1
  image:
    repository: ghcr.io/splattner/openzev-backend
    tag: ""
    pullPolicy: IfNotPresent
  command:
    - celery
    - -A
    - config
    - worker
    - -l
    - info
  podAnnotations: {}
  podSecurityContext: *defaultPodSecurityContext
  securityContext: *defaultSecurityContext
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

# Exactly one Beat scheduler must run for a release. Multiple replicas would
# enqueue every periodic task more than once at each tick.
beat:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/splattner/openzev-backend
    tag: ""
    pullPolicy: IfNotPresent
  command:
    - celery
    - -A
    - config
    - beat
    - -l
    - info
    - --scheduler
    - django_celery_beat.schedulers:DatabaseScheduler
  podAnnotations: {}
  podSecurityContext: *defaultPodSecurityContext
  securityContext: *defaultSecurityContext
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: {}

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/splattner/openzev-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  podAnnotations: {}
  podSecurityContext: *defaultPodSecurityContext
  securityContext: *defaultSecurityContext
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

media:
  pvc:
    existingClaim: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""

# If existingSecret.name is set, DATABASE_URL is read from secret key.
database:
  url: "postgres://openzev:openzev@db:5432/openzev"
  existingSecret:
    name: ""
    key: DATABASE_URL

# Valkey (or any Redis-compatible server) is external to this chart.
valkey:
  url: "redis://valkey:6379/0"
  # Cache DB (e.g. geocoding results) — kept on a separate logical DB
  # from the Celery broker above so cache keys never collide with Celery's.
  cacheUrl: "redis://valkey:6379/1"

# Deprecated: use `valkey` above. When set, these still take precedence so
# existing installs that override `redis.url` / `redis.cacheUrl` keep working.
redis:
  url: ""
  cacheUrl: ""

email:
  backend: "django.core.mail.backends.console.EmailBackend"
  host: "smtp.example.com"
  port: 587
  useTls: true
  hostUser: ""
  defaultFromEmail: "openzev@example.com"
  # EMAIL_HOST_PASSWORD is read from an existing Kubernetes Secret when name is set.
  existingSecret:
    name: ""
    key: EMAIL_HOST_PASSWORD

ingress:
  enabled: true
  className: ""
  # 50m covers the upload endpoints (ingress-nginx defaults to 1m, which
  # would kill even small imports). Per-location limits for the docker
  # fullstack setup live in docker/fullstack-nginx.conf.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  tls: []
  hosts:
    - host: openzev.local
      frontendPaths:
        - /
      backendPaths:
        - /api
