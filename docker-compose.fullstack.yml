# Single-container self-hosting stack. Requires backend/.env — see README "Self-hosting".
# Only 8080 is published; db/redis talk over the compose network.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.fullstack
      args:
        VITE_API_BASE_URL: /api/v1
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://openzev:openzev@db:5432/openzev
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      # One trusted proxy hop: the fullstack nginx overwrites X-Forwarded-For.
      NUM_PROXIES: 1
    depends_on:
      - db
      - redis
    ports:
      - "8080:80"
    volumes:
      - backend_media:/app/media

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config worker -l info
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://openzev:openzev@db:5432/openzev
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    volumes:
      - backend_media:/app/media
    depends_on:
      - app
      - redis

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgres://openzev:openzev@db:5432/openzev
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    depends_on:
      - app
      - redis
    # On a fresh stack, migrations run inside the app container's own
    # startup command and this container can win the race and start before
    # they land — django_celery_beat's scheduler tables won't exist yet and
    # it exits. Unlike every other service here, that first failure is
    # expected rather than a bug, so unlike them beat gets a restart policy.
    restart: on-failure

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: openzev
      POSTGRES_USER: openzev
      # Fixed password is deliberate — this port is never published.
      POSTGRES_PASSWORD: openzev
      # Keep in step with docker-compose.yml — see the note there.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Same mount path as docker-compose.yml: the volume is shared, and a
      # differing path silently gives this stack its own cluster (#492).
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine

volumes:
  postgres_data:
  backend_media:
