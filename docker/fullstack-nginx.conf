# Compose publishes on loopback; the outer proxy must overwrite X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_scheme {
  https    https;
  default  $scheme;
}

map $uri $log_path {
  default $uri;
  ~*^/signin/ /signin/[redacted];
}

log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $log_path $server_protocol" $status $body_bytes_sent';

server {
  listen 8080;
  server_name _;

  # Log only the path; query strings can contain authentication tokens.
  access_log /dev/stdout no_query;

  root /usr/share/nginx/html;
  index index.html;

  # Inherited by every proxying location below (none overrides the set).
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Overwrite. Do not append; this hop is the only one we trust.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $forwarded_scheme;

  # Modest global default; larger caps per upload endpoint below.
  client_max_body_size 10m;

  # JSON error for 413 so frontend can parse it (default is HTML).
  error_page 413 /413.json;
  location = /413.json {
    default_type application/json;
    return 413 '{"detail":"File too large."}';
  }

  # Import endpoints need larger bodies (SDAT annual dumps ~25-50MB, XLSX ZIPs).
  # Must appear before the generic /api/ prefix match.
  location /api/v1/metering/import/ {
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:8000;
  }

  location ~ ^/api/v1/zev/zevs/(import-archive|inspect-archive) {
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:8000;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000;

    # Invoice links and OAuth callbacks carry secrets nginx cannot redact.
    location ~ ^/api/v1/(public/invoices/|auth/oauth/callback/) {
      error_log /dev/null;
      proxy_pass http://127.0.0.1:8000;
    }
  }

  location ~* ^/(i/|join/|signin/|verify-email/?$|reset-password/?$|confirm-email-change/?$|oauth/callback/?$) {
    error_log /dev/null;
    add_header Referrer-Policy no-referrer always;
    try_files /index.html =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
